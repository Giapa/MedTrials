[project]
name = "backend"
version = "0.1.0"
description = "Registry access for the MedTrials project"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
